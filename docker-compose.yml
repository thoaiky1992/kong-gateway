name: kong-api

x-kong-env: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-db
  KONG_PG_PORT: "5432"
  KONG_PG_DATABASE: kong
  KONG_PG_SCHEMA: kong
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:?Set KONG_PG_PASSWORD in .env}
  

services:
  kong-db:
    image: postgres:16-alpine
    container_name: kong-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:?Set KONG_PG_PASSWORD in .env}
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - kong-net

  # First installation only:
  # docker compose --profile tools run --rm kong-migrations
  kong-migrations:
    image: kong:3.9.1
    profiles: ["tools"]
    restart: "no"
    command: ["kong", "migrations", "bootstrap"]
    environment:
      <<: *kong-env
    depends_on:
      kong-db:
        condition: service_healthy
    networks:
      - kong-net

  kong:
    image: kong:3.9.1
    container_name: kong-api
    restart: unless-stopped
    environment:
      <<: *kong-env
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_ADMIN_GUI_URL: "http://localhost:8002"
      KONG_ADMIN_GUI_API_URL: "http://localhost:8002/_api"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

    depends_on:
      kong-db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - kong-net

  kong-admin-auth:
    image: nginx:1.27-alpine
    container_name: kong-admin-auth
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8080"
    volumes:
      - ./nginx-kong-admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - kong-net


  user-api:
    build:
      context: .
      dockerfile: Dockerfile.user
    container_name: user-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - kong-net

  post-api:
    build:
      context: .
      dockerfile: Dockerfile.post
    container_name: post-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    networks:
      - kong-net

volumes:
  kong-db-data:

networks:
  kong-net:
    name: kong-net
    driver: bridge
